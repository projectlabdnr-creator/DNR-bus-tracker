<style>
:root {
    /* Daytime Sky Blue Theme Palette */
    --bg-main: linear-gradient(180deg, #3b82f6 0%, #60a5fa 40%, #93c5fd 75%, #e0f2fe 100%);
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: rgba(255, 255, 255, 0.6);
    --accent-blue: #2563eb;
    --accent-green: #059669;
    --accent-red: #dc2626;
    --accent-purple: #7c3aed;
    --text-primary: #0f172a;
    --text-secondary: #475569;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-main);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
}

/* CSS-Generated Cloud Overlays */
.bg-clouds {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1;
    pointer-events: none;
    background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.8) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.7) 0%, transparent 45%),
        radial-gradient(circle at 50% 65%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 25% 85%, rgba(255, 255, 255, 0.75) 0%, transparent 40%);
    filter: blur(35px);
}

/* ================= PORTAL SELECTION SCREEN ================= */
#roleSelectionScreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: transparent;
    display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px;
    overflow-y: auto;
}

.role-box {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(25px);
    padding: 40px 32px; border-radius: 28px; text-align: center; max-width: 900px; width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
}
